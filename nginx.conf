server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/html image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache les assets statiques, pas le HTML (pour pouvoir le mettre à jour sans surprise)
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
